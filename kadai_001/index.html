<!DOCTYPE html>
<html>
  <head>
    <title>MyProfile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="自己紹介と趣味">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>

    <!-- ヘッダー -->
    <header>

     <!-- ロゴ -->
      <div class="header-inner">

        <!-- My Profile -->
        <h1>
          <a href="index.html" class="home">My Profile</a> 
        </h1>
     
        <!-- ナビゲーション -->
        <nav id="menu">
          <ul>
           <li><a href="index.html#about">About</a></li>
           <li><a href="index.html#works">Works</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <article>

        <!-- メイン画像　 -->
        <div>
          <img class="mainimg"  src="images/main.png" alt="カメラ">
        </div>

        <!-- About -->
        <section class="about">
          <h2 id="about">About</h2>
          <div class="about-inner">
            <img class="circle" src="images/about.png" alt="プロフ画像">
            <div class="content">
              <p class="name">Kazuki Asahina</p>
              <ul>
                <li>25歳 長野県佐久市出身</li>
                <li>ソフトウェア業界でマーケティングに従事</li>
                <li>趣味はカメラ、愛機はCanon</li>
                <li>自然を撮影するのが好きで、海や山によく行く</li>
              </ul>
            </div>
          </div>
        </section>
        <!--works  -->
        <section class="works">
          <h2 id="works">Works</h2>
          <div class="works-inner">
            <div class="item">
              <img src="images/works1.png" alt="日本海">
              <p>新潟に訪れた際に、日本海の雄大さを魅了されて撮影した1枚</p>
            </div>
            <div class="item">
              <img src="images/works2.png" alt="山">
              <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
            </div>
            <div class="item">
              <img src="images/works3.png" alt="京都">
              <p>京都で撮影した、明け方の古き良き日本の町並み</p>
            </div>
          </div>
        </section>
      </article>
    </main>
    <!-- フッター -->
     <footer>
     <p>© MyProfile. All rights reserved.</p>
     </footer>
  </body>
</html>
